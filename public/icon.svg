<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#064e3b" />
      <stop offset="50%" stop-color="#047857" />
      <stop offset="100%" stop-color="#065f46" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.4" />
    </filter>
  </defs>

  <!-- App Icon Background Squircle with Border -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />
  <rect x="6" y="6" width="500" height="500" rx="106" fill="none" stroke="#34d399" stroke-width="4" stroke-opacity="0.3" />

  <!-- Centered Dadaya Crest -->
  <g transform="translate(96, 68) scale(2.65)" filter="url(#shadow)">
    <!-- Definitions for curved text -->
    <defs>
      <path id="high-path" d="M 16,128 Q 30,138 48,142" fill="none" />
      <path id="school-path" d="M 72,142 Q 90,138 104,128" fill="none" />
      <path id="motto-top" d="M 34,42 Q 60,30 86,42" fill="none" />
    </defs>

    <!-- Outer Green Shield Base with Crest Peaks -->
    <path
      d="M 14,14 C 36,4 48,16 60,16 C 72,16 84,4 106,14 C 108,50 106,86 60,132 C 14,86 12,50 14,14 Z"
      fill="#15803D"
      stroke="#166534"
      stroke-width="1.5"
    />

    <!-- Inner White Border Trim -->
    <path
      d="M 18,18 C 38,9 49,19 60,19 C 71,19 82,9 102,18 C 103,49 101,82 60,126 C 19,82 17,49 18,18 Z"
      fill="none"
      stroke="#FFFFFF"
      stroke-width="2.5"
      stroke-linejoin="round"
    />

    <!-- Yellow/Gold Inner Motto Frame -->
    <path
      d="M 25,38 C 25,28 38,24 60,24 C 82,24 95,28 95,38 L 95,84 L 60,114 L 25,84 Z"
      fill="#FBBF24"
      stroke="#1F2937"
      stroke-width="1.8"
      stroke-linejoin="round"
    />

    <!-- Motto Inscriptions -->
    <text font-size="5.5" font-weight="900" font-family="Arial, sans-serif" fill="#1F2937" text-anchor="middle">
      <textPath href="#motto-top" startOffset="50%">
        EDUCATION FOR LIFE
      </textPath>
    </text>
    <text x="29" y="70" font-size="5.2" font-weight="900" font-family="Arial, sans-serif" fill="#1F2937" transform="rotate(-90 29,70)" text-anchor="middle">
      IMFUNDO
    </text>
    <text x="91" y="70" font-size="5.2" font-weight="900" font-family="Arial, sans-serif" fill="#1F2937" transform="rotate(90 91,70)" text-anchor="middle">
      YOWUPENYU
    </text>
    <text x="40" y="100" font-size="5.2" font-weight="900" font-family="Arial, sans-serif" fill="#1F2937" transform="rotate(40 40,100)" text-anchor="middle">
      TEMPILO
    </text>
    <text x="80" y="100" font-size="5.2" font-weight="900" font-family="Arial, sans-serif" fill="#1F2937" transform="rotate(-40 80,100)" text-anchor="middle">
      DZIDZO
    </text>

    <!-- Center White Shield/Plaque -->
    <rect x="34" y="35" width="52" height="55" rx="6" fill="#FFFFFF" stroke="#1F2937" stroke-width="1.8" />

    <!-- Red Crown / Torch Motif at top of White Plaque -->
    <path d="M 48,45 L 48,34 L 54,39 L 60,32 L 66,39 L 72,34 L 72,45 Z" fill="#DC2626" stroke="#1F2937" stroke-width="1.4" stroke-linejoin="round" />
    <path d="M 48,43 Q 60,46 72,43" stroke="#1F2937" stroke-width="1.4" fill="none" />

    <!-- Open Red Book Emblem with 'DADAYA' text -->
    <path d="M 37,56 C 45,51 56,53 60,57 C 64,53 75,51 83,56 L 83,73 C 75,68 64,70 60,74 C 56,70 45,68 37,73 Z" fill="#EF4444" stroke="#1F2937" stroke-width="1.5" stroke-linejoin="round" />
    <line x1="60" y1="57" x2="60" y2="74" stroke="#1F2937" stroke-width="1.5" />
    <path d="M 37,73 Q 48,77 60,74 Q 72,77 83,73" stroke="#1F2937" stroke-width="1.2" fill="none" />

    <!-- 'DADAYA' Title inside the Red Book -->
    <text x="60" y="67" font-size="7.5" font-weight="900" font-family="'Arial Black', Impact, sans-serif" fill="#FFFFFF" text-anchor="middle" letter-spacing="0.8">
      DADAYA
    </text>

    <!-- Red Pen Nib / Quill pointing downward -->
    <path d="M 57,74 L 63,74 L 60.5,90 L 59.5,90 Z" fill="#DC2626" stroke="#1F2937" stroke-width="1.2" stroke-linejoin="round" />
    <line x1="60" y1="74" x2="60" y2="87" stroke="#1F2937" stroke-width="0.8" />

    <!-- Outer 'HIGH SCHOOL' Text underneath the shield -->
    <text font-size="9" font-weight="900" font-family="'Arial Black', sans-serif" fill="#FFFFFF" text-anchor="end">
      <textPath href="#high-path" startOffset="90%">
        HIGH
      </textPath>
    </text>
    <text font-size="9" font-weight="900" font-family="'Arial Black', sans-serif" fill="#FFFFFF" text-anchor="start">
      <textPath href="#school-path" startOffset="10%">
        SCHOOL
      </textPath>
    </text>
  </g>
</svg>
