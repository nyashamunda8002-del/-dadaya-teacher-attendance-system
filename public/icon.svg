<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#064e3b" />
      <stop offset="50%" stop-color="#047857" />
      <stop offset="100%" stop-color="#065f46" />
    </linearGradient>
    <linearGradient id="crestGoldGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FBBF24" />
      <stop offset="100%" stop-color="#F59E0B" />
    </linearGradient>
    <linearGradient id="shieldGreenGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#15803D" />
      <stop offset="50%" stop-color="#166534" />
      <stop offset="100%" stop-color="#14532D" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.4" />
    </filter>
  </defs>

  <!-- App Icon Background Squircle with Border -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />
  <rect x="6" y="6" width="500" height="500" rx="106" fill="none" stroke="#34d399" stroke-width="4" stroke-opacity="0.3" />

  <!-- Centered Dadaya Crest with Full School Name -->
  <g transform="translate(46, 26) scale(2.1)" filter="url(#shadow)">
    <defs>
      <!-- Top Motto Arch -->
      <path id="icon-top-motto-path" d="M 48,46 Q 100,28 152,46" fill="none" />
      <!-- Lower Left HIGH Path -->
      <path id="icon-crest-high-path" d="M 32,196 Q 64,218 92,220" fill="none" />
      <!-- Lower Right SCHOOL Path with ample length so SCHOOL is never truncated -->
      <path id="icon-crest-school-path" d="M 108,220 Q 138,218 172,194" fill="none" />
    </defs>

    <!-- 1. OUTER GREEN SHIELD -->
    <path
      d="M 30,26 C 65,12 85,30 100,30 C 115,30 135,12 170,26 C 174,75 168,128 100,185 C 32,128 26,75 30,26 Z"
      fill="url(#shieldGreenGradient)"
      stroke="#0F3D24"
      stroke-width="2.5"
      stroke-linejoin="round"
    />

    <!-- 2. INNER WHITE SHIELD CONTOUR -->
    <path
      d="M 36,32 C 68,20 86,36 100,36 C 114,36 132,20 164,32 C 167,76 161,123 100,176 C 39,123 33,76 36,32 Z"
      fill="none"
      stroke="#FFFFFF"
      stroke-width="3.5"
      stroke-linejoin="round"
    />

    <!-- 3. GOLD INNER MOTTO FRAME -->
    <path
      d="M 45,54 C 45,40 68,34 100,34 C 132,34 155,40 155,54 L 155,120 L 100,165 L 45,120 Z"
      fill="url(#crestGoldGradient)"
      stroke="#1E293B"
      stroke-width="2.5"
      stroke-linejoin="round"
    />

    <!-- 4. MOTTO INSCRIPTIONS -->
    <!-- Top: EDUCATION FOR LIFE -->
    <text
      font-size="8.5"
      font-weight="900"
      font-family="'Arial Black', Impact, sans-serif"
      fill="#1E293B"
      letter-spacing="0.6"
    >
      <textPath href="#icon-top-motto-path" startOffset="50%" text-anchor="middle">
        EDUCATION FOR LIFE
      </textPath>
    </text>

    <!-- Left: IMFUNDO -->
    <text
      x="52"
      y="92"
      font-size="8"
      font-weight="900"
      font-family="'Arial Black', sans-serif"
      fill="#1E293B"
      transform="rotate(-90 52,92)"
      text-anchor="middle"
      letter-spacing="0.5"
    >
      IMFUNDO
    </text>

    <!-- Right: YOWUPENYU -->
    <text
      x="148"
      y="92"
      font-size="7.5"
      font-weight="900"
      font-family="'Arial Black', sans-serif"
      fill="#1E293B"
      transform="rotate(90 148,92)"
      text-anchor="middle"
      letter-spacing="0.4"
    >
      YOWUPENYU
    </text>

    <!-- Bottom Left: TEMPILO -->
    <text
      x="70"
      y="145"
      font-size="7.5"
      font-weight="900"
      font-family="'Arial Black', sans-serif"
      fill="#1E293B"
      transform="rotate(40 70,145)"
      text-anchor="middle"
      letter-spacing="0.4"
    >
      TEMPILO
    </text>

    <!-- Bottom Right: DZIDZO -->
    <text
      x="130"
      y="145"
      font-size="7.5"
      font-weight="900"
      font-family="'Arial Black', sans-serif"
      fill="#1E293B"
      transform="rotate(-40 130,145)"
      text-anchor="middle"
      letter-spacing="0.4"
    >
      DZIDZO
    </text>

    <!-- 5. CENTER WHITE SHIELD PLAQUE -->
    <rect
      x="58"
      y="56"
      width="84"
      height="76"
      rx="8"
      fill="#FFFFFF"
      stroke="#1E293B"
      stroke-width="2.5"
    />

    <!-- 6. RED CROWN AT TOP OF WHITE PLAQUE -->
    <path
      d="M 74,70 L 74,58 L 86,65 L 100,54 L 114,65 L 126,58 L 126,70 Z"
      fill="#EF4444"
      stroke="#1E293B"
      stroke-width="2"
      stroke-linejoin="round"
    />

    <!-- 7. RED OPEN BOOK EMBLEM WITH DADAYA -->
    <path
      d="M 64,82 C 78,75 94,78 100,83 C 106,78 122,75 136,82 L 136,104 C 122,97 106,100 100,105 C 94,100 78,97 64,104 Z"
      fill="#EF4444"
      stroke="#1E293B"
      stroke-width="2"
      stroke-linejoin="round"
    />
    <line x1="100" y1="83" x2="100" y2="105" stroke="#1E293B" stroke-width="2" />

    <!-- DADAYA Text on the Book -->
    <text
      x="100"
      y="96"
      font-size="10"
      font-weight="900"
      font-family="'Arial Black', Impact, sans-serif"
      fill="#111827"
      text-anchor="middle"
      letter-spacing="0.8"
    >
      DADAYA
    </text>

    <!-- 8. RED PEN NIB -->
    <path
      d="M 96,105 L 104,105 L 101,126 L 99,126 Z"
      fill="#EF4444"
      stroke="#1E293B"
      stroke-width="1.8"
      stroke-linejoin="round"
    />

    <!-- 9. BOTTOM TEXT: COMPLETE "HIGH" AND "SCHOOL" (White for dark icon contrast) -->
    <!-- Left Arc: HIGH -->
    <text
      font-size="16"
      font-weight="900"
      font-family="'Arial Black', Impact, sans-serif"
      fill="#FFFFFF"
      letter-spacing="0.8"
    >
      <textPath href="#icon-crest-high-path" startOffset="50%" text-anchor="middle">
        HIGH
      </textPath>
    </text>

    <!-- Right Arc: SCHOOL (Complete with S-C-H-O-O-L) -->
    <text
      font-size="16"
      font-weight="900"
      font-family="'Arial Black', Impact, sans-serif"
      fill="#FFFFFF"
      letter-spacing="0.8"
    >
      <textPath href="#icon-crest-school-path" startOffset="50%" text-anchor="middle">
        SCHOOL
      </textPath>
    </text>
  </g>
</svg>

