    <meta name="description" content="Dadaya High School Teacher & Admin Attendance System with Zimbabwe MoPSE calendar compliance, termly reports, PDF and Microsoft Access export, background phone notifications, and national public holiday greetings." />
    <meta name="theme-color" content="#064e3b" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Dadaya Attendance" />

    <link rel="preconnect" href="https://fonts.googleapis.com">

    <script>
      // Register Service Worker for mobile phone notifications and PWA offline support
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', function() {
          navigator.serviceWorker.register('/sw.js')
            .then(function(reg) {
              console.log('Dadaya Service Worker registered with scope:', reg.scope);
            })
            .catch(function(err) {
              console.warn('Service Worker registration note:', err);
            });
        });
      }
    </script>

  <body class="bg-slate-100 font-sans antialiased text-slate-900">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
